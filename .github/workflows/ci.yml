name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rag]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Format check with ruff
        run: ruff format --check src/ tests/

      - name: Run tests
        run: pytest --cov=src/self_improving_agent --cov-fail-under=80 -m "not slow and not integration"

  eval-validate:
    # Cheap quality gate that runs on every push: confirms the eval
    # pipeline still works (tests parse, registry loads, reports validate)
    # without running inference. Catches "the eval harness broke" early.
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rag]"

      - name: Validate eval pipeline
        run: python -m self_improving_agent.cli eval-validate --min-tests 1

  eval-remote:
    # Optional model-quality gate. Runs the golden-test suite against the
    # remote (Groq) provider when GROQ_API_KEY is configured as a secret.
    # Soft gate — failures are reported but don't fail the workflow until
    # we have a stable baseline to compare against.
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rag]"

      - name: Run remote eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY secret not configured — skipping remote eval."
            exit 0
          fi
          python -m self_improving_agent.cli evaluate --remote --no-write
        continue-on-error: true
